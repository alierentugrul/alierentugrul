<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260">
  <defs>
    <!-- Izgara Deseni -->
    <pattern id="tech-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#121820" stroke-width="0.8" />
    </pattern>

    <!-- Lazer Tarama Cizgisi Gradyani -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="75%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <!-- Hedef Alan Karartma Gradyani -->
    <linearGradient id="box-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.01" />
    </linearGradient>
  </defs>

  <!-- Arka Plan -->
  <rect width="850" height="260" rx="8" fill="#080C10" />
  <rect width="850" height="260" rx="8" fill="url(#tech-grid)" />
  <rect width="848" height="258" x="1" y="1" rx="7" fill="none" stroke="#1B2430" stroke-width="1.2" />

  <!-- Kose Optik Isaretcileri (+) -->
  <g stroke="#334155" stroke-width="1.2">
    <path d="M 12 16 L 20 16 M 16 12 L 16 20" />
    <path d="M 830 16 L 838 16 M 834 12 L 834 20" />
    <path d="M 12 244 L 20 244 M 16 240 L 16 248" />
    <path d="M 830 244 L 838 244 M 834 240 L 834 248" />
  </g>

  <!-- Ust Telemetri Cubugu -->
  <g font-family="monospace" font-size="10">
    <text x="32" y="36" fill="#475569">SYS // OPTICAL_INSPECTION_PIPELINE</text>
    <text x="330" y="36" fill="#00F0FF" opacity="0.85">LATENCY: 3.8ms [FP16]</text>
    
    <!-- Canli Yanip Sonen Sinyal (SMIL Animasyonu) -->
    <circle cx="740" cy="32" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="740" cy="32" r="3.5" fill="none" stroke="#10B981" stroke-width="1">
      <animate attributeName="r" values="3.5;7.5;3.5" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="754" y="36" fill="#10B981" font-weight="bold">INFERENCE_OK</text>
  </g>

  <line x1="32" y1="48" x2="818" y2="48" stroke="#16202C" stroke-width="1" />

  <!-- Sol Blok: Kimlik ve Uzmanlik -->
  <g transform="translate(36, 85)">
    <text font-family="system-ui, -apple-system, sans-serif" x="0" y="28" font-size="28" font-weight="bold" fill="#F8FAFC">Ali Eren Tu&#287;rul</text>
    
    <text font-family="monospace" x="0" y="58" font-size="12.5" font-weight="bold" fill="#00F0FF">
      COMPUTER ENGINEER &#8226; AI &amp; COMPUTER VISION
    </text>
    
    <text font-family="system-ui, -apple-system, sans-serif" x="0" y="86" font-size="12" fill="#94A3B8">
      Deep Learning &#8226; TensorRT Inference &#8226; RAG Architectures &#8226; Industrial Inspection
    </text>

    <!-- Alt Metrik Verileri -->
    <g font-family="monospace" font-size="9.5" fill="#64748B" transform="translate(0, 118)">
      <text x="0" y="0">RUNTIMES: [PyTorch 2.x, TensorRT, CUDA, OpenCV]</text>
      <text x="0" y="16">RETRIEVAL: [ChromaDB, Hybrid BM25, MiniLM, Local LLM]</text>
    </g>
  </g>

  <!-- Sag Blok: Endustriyel Goruntu Isleme / Bounding Box Simulasyonu -->
  <g transform="translate(560, 68)">
    <!-- Bounding Box Arka Plani -->
    <rect x="0" y="0" width="258" height="135" rx="3" fill="url(#box-bg)" />
    
    <!-- Lazer Tarama Cizgisi (SMIL ile Hareket) -->
    <line x1="4" y1="8" x2="254" y2="8" stroke="url(#laser-grad)" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 118; 0 0" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1; 0.95; 0.1" dur="2.8s" repeatCount="indefinite" />
    </line>

    <!-- Kose Vizor Parantezleri [ ] (SMIL ile Nefes Alma) -->
    <g fill="none" stroke="#00F0FF" stroke-width="2">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.2s" repeatCount="indefinite" />
      <!-- Sol Ust -->
      <path d="M 0 16 L 0 0 L 16 0" />
      <!-- Sag Ust -->
      <path d="M 242 0 L 258 0 L 258 16" />
      <!-- Sol Alt -->
      <path d="M 0 119 L 0 135 L 16 135" />
      <!-- Sag Alt -->
      <path d="M 242 135 L 258 135 L 258 119" />
    </g>

    <!-- Merkez Hedef Artisi (+) -->
    <path d="M 125 67.5 L 133 67.5 M 129 63.5 L 129 71.5" stroke="#00F0FF" stroke-width="1" opacity="0.6" />

    <!-- Vizor Ici Telemetri Etiketleri -->
    <g font-family="monospace" font-size="9" fill="#00F0FF">
      <!-- Sol Ust Etiket -->
      <rect x="6" y="6" width="102" height="15" fill="#0D1520" rx="2" stroke="#1E293B" stroke-width="0.8"/>
      <text x="11" y="17" fill="#38BDF8">TARGET: DEFECT_SCAN</text>

      <!-- Sag Ust Dogruluk -->
      <rect x="180" y="6" width="72" height="15" fill="#0D1520" rx="2" stroke="#1E293B" stroke-width="0.8"/>
      <text x="185" y="17" fill="#10B981">CONF: 0.994</text>

      <!-- Sol Alt Koordinatlar -->
      <text x="8" y="126" fill="#64748B" font-size="8.5">ROI: [X:412 Y:188 W:64 H:64]</text>

      <!-- Sag Alt Cikarim Suresi -->
      <text x="178" y="126" fill="#F59E0B" font-size="8.5">INFER: 4.2ms</text>
    </g>
  </g>

  <!-- Alt Durum Cizgisi -->
  <line x1="32" y1="228" x2="818" y2="228" stroke="#16202C" stroke-width="1" />
  
  <g font-family="monospace" font-size="9" fill="#475569" transform="translate(32, 244)">
    <text x="0" y="0">NODE: INDUSTRIAL_EDGE_01</text>
    <text x="240" y="0">PLC_SYNC: VERIFIED (GCA_LINE)</text>
    <text x="490" y="0">ARCH: CNN_RESNET_QUANTIZED</text>
    <text x="720" y="0">STATUS: NOMINAL</text>
  </g>
</svg>
